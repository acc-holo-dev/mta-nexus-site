packages:
  - "apps/*"
  - "packages/*"
# The repository develops through the Docker path (no host node_modules).
# Host-side orchestration scripts (pnpm dev:docker:*, pnpm test:isolated) must
# not trigger pnpm's automatic dependency installation before running.
verifyDepsBeforeRun: warn
allowBuilds:
  "@swc/core": true
  esbuild: true
packageExtensions:
  # Stable dependency-cruiser still needs the TS 6 compiler API for tsPreCompilationDeps.
  # Native TypeScript 7 support lands in dependency-cruiser ≥18.8 with typescript ≥7.1;
  # keep this extension until that pair is installed and verified.
  "dependency-cruiser@18.7.0":
    dependencies:
      typescript: "6.0.3"
overrides:
  # drizzle-kit 0.31.11 still pulls @esbuild-kit/*; pin its nested esbuild for security.
  "@esbuild-kit/core-utils>esbuild": "0.28.2"
  # Vitest 5 accepts Vite ^6.4 || ^7 || ^8; pin the current Vite 8 release for the unit toolchain.
  "vite": "8.3.5"
