# Optional file-backed secret mounts for the recovery producer and worker.
# Include after compose.recovery.yaml and compose.mail-worker.yaml.
# Host source paths are consumed by Docker Compose and are never exposed inside
# the containers; services see only fixed /run/secrets paths.
secrets:
  nexus_account_mail_key:
    file: ${NEXUS_ACCOUNT_MAIL_KEY_HOST_FILE:?set NEXUS_ACCOUNT_MAIL_KEY_HOST_FILE}
  nexus_account_recovery_abuse_key:
    file: ${NEXUS_ACCOUNT_RECOVERY_ABUSE_KEY_HOST_FILE:?set NEXUS_ACCOUNT_RECOVERY_ABUSE_KEY_HOST_FILE}

services:
  app:
    environment:
      ACCOUNT_MAIL_KEY: ""
      ACCOUNT_MAIL_KEY_FILE: /run/secrets/nexus_account_mail_key
      ACCOUNT_RECOVERY_ABUSE_KEY: ""
      ACCOUNT_RECOVERY_ABUSE_KEY_FILE: /run/secrets/nexus_account_recovery_abuse_key
    secrets:
      - nexus_account_mail_key
      - nexus_account_recovery_abuse_key

  mail-worker:
    environment:
      ACCOUNT_MAIL_KEY: ""
      ACCOUNT_MAIL_KEY_FILE: /run/secrets/nexus_account_mail_key
    secrets:
      - nexus_account_mail_key
