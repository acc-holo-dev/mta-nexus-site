# Optional file-backed secret mounts for the recovery producer and worker.
# Include after compose.recovery.yaml and compose.mail-worker.yaml.
# Host source paths are never passed through as container paths.
services:
  app:
    environment:
      ACCOUNT_MAIL_KEY: ""
      ACCOUNT_MAIL_KEY_FILE: /run/secrets/nexus-recovery/account-mail-key
      ACCOUNT_RECOVERY_ABUSE_KEY: ""
      ACCOUNT_RECOVERY_ABUSE_KEY_FILE: /run/secrets/nexus-recovery/account-recovery-abuse-key
    volumes:
      - type: bind
        source: ${NEXUS_ACCOUNT_MAIL_KEY_HOST_FILE:?set NEXUS_ACCOUNT_MAIL_KEY_HOST_FILE}
        target: /run/secrets/nexus-recovery/account-mail-key
        read_only: true
      - type: bind
        source: ${NEXUS_ACCOUNT_RECOVERY_ABUSE_KEY_HOST_FILE:?set NEXUS_ACCOUNT_RECOVERY_ABUSE_KEY_HOST_FILE}
        target: /run/secrets/nexus-recovery/account-recovery-abuse-key
        read_only: true
  mail-worker:
    environment:
      ACCOUNT_MAIL_KEY: ""
      ACCOUNT_MAIL_KEY_FILE: /run/secrets/nexus-recovery/account-mail-key
    volumes:
      - type: bind
        source: ${NEXUS_ACCOUNT_MAIL_KEY_HOST_FILE:?set NEXUS_ACCOUNT_MAIL_KEY_HOST_FILE}
        target: /run/secrets/nexus-recovery/account-mail-key
        read_only: true
