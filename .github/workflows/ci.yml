name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_test_secret
          POSTGRES_DB: mta_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d mta_nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://nexus:nexus_test_secret@localhost:5432/mta_nexus_test
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-validation
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: ./temp/ci-uploads
      EMAIL_PROVIDER: log

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.0.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify project
        run: pnpm check

      - name: Build production image
        run: docker build --tag mta-nexus:ci .

  postgres-persistence:
    name: PostgreSQL persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.0.0
      - name: Check persistence test isolation
        run: node --test scripts/tests/postgres-persistence.test.mjs
      - name: Recreate PostgreSQL with its named volume
        run: node scripts/check-postgres-persistence.mjs
