name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_test_secret
          POSTGRES_DB: mta_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d mta_nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://nexus:nexus_test_secret@localhost:5432/mta_nexus_test
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-validation
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: ./temp/ci-uploads
      EMAIL_PROVIDER: log
      DOMAIN: ci.nexus-mta.test
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_compose_ci_secret
      POSTGRES_DB: mta_nexus_compose_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.0.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify migrations are repeatable
        run: pnpm db:migrate

      - name: Verify project
        run: pnpm check

      - name: Build production image
        run: docker build --tag mta-nexus:ci .

      - name: Validate production Compose
        run: docker compose -f compose.production.yaml -f compose.ci.yaml config --quiet

      - name: Start production service stack
        run: docker compose -f compose.production.yaml -f compose.ci.yaml up -d --no-build postgres clamav app

      - name: Smoke-test production health
        run: curl --fail --silent --show-error --retry 36 --retry-delay 5 --retry-all-errors http://127.0.0.1:3000/api/health

      - name: Show production service logs
        if: failure()
        run: docker compose -f compose.production.yaml -f compose.ci.yaml logs --no-color --tail=200 postgres clamav app

      - name: Stop production service stack
        if: always()
        run: docker compose -f compose.production.yaml -f compose.ci.yaml down --volumes --remove-orphans
