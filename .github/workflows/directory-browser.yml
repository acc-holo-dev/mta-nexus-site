name: Directory browser

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: directory-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  directory-browser:
    name: Guest server directory
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.0.0
      - name: Install pinned browser-only tools outside the app
        shell: bash
        run: |
          tools="$RUNNER_TEMP/nexus-browser-tools"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/nexus-browsers"
          npm install --prefix "$tools" --no-audit --no-fund --save-exact @playwright/test@1.62.1 agent-browser@0.33.2
          node "$tools/node_modules/@playwright/test/cli.js" install --with-deps chromium
          sudo apt-get install -y libnss3-tools
          echo "NEXUS_BROWSER_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          echo "NEXUS_BROWSER_REPORT_DIR=$RUNNER_TEMP/nexus-directory-report" >> "$GITHUB_ENV"
      - name: Check the real production page in Chromium
        id: browser-check
        run: bash scripts/check-directory-browser.sh
      - name: Publish textual evidence independently of artifact storage
        if: always()
        shell: bash
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.browser-check.outcome }}
        run: |
          report="$RUNNER_TEMP/nexus-directory-report"
          if [ "$ACCEPTANCE_OUTCOME" = success ]; then
            test -s "$report/results.json"
            test -s "$report/summary.md"
          fi
          if [ -f "$report/summary.md" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$report/summary.md"
          fi
          for file in results.json live-source.json agent-browser-snapshot.txt; do
            if [ -f "$report/$file" ]; then
              echo "Evidence: $file"
              cat "$report/$file"
              echo
            fi
          done
      # Screenshots supplement the mandatory assertions and text evidence.
      # A quota failure must be visible, but is not a failed browser assertion.
      - name: Keep optional screenshots and browser reports
        id: browser-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: directory-browser-${{ github.sha }}
          path: ${{ runner.temp }}/nexus-directory-report
          if-no-files-found: warn
          retention-days: 3
      - name: Report missing screenshot artifacts explicitly
        if: ${{ always() && steps.browser-artifact.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::Browser artifact upload failed. Screenshots are unavailable; inspect the upload step. Mandatory browser assertions and textual evidence retain their own result.'
          echo 'WARNING: screenshot/report artifact upload failed. Use the textual evidence in this run; no screenshot-based visual approval is implied. Existing artifacts and storage settings were not changed.' >> "$GITHUB_STEP_SUMMARY"
