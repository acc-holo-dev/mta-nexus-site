name: Account browser
permissions:
  contents: read
jobs:
  account-browser:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - suite: account
          name: Account access and logout
        - suite: password
          name: Password and session security
    env:
      NEXUS_ACCOUNT_SUITE: ${{ matrix.suite }}
      NEXUS_CI_PREBUILT_IMAGE: nexus-ci:${{ github.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - name: Restore shared production image by exact commit
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/production.tar
        key: nexus-production-image-${{ runner.os }}-${{ github.sha }}
        fail-on-cache-miss: true
    - name: Load the exact commit image
      run: |-
        docker load --input "$RUNNER_TEMP/production.tar"
        bash scripts/validate-ci-image.sh
    - name: Install browser-only tools outside the app
      shell: bash
      run: |
        tools="$RUNNER_TEMP/nexus-auth-tools"
        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/nexus-auth-browsers"
        npm install --prefix "$tools" --no-audit --no-fund --save-exact @playwright/test@1.62.1 agent-browser@0.33.2
        node "$tools/node_modules/@playwright/test/cli.js" install --with-deps chromium
        sudo apt-get install -y libnss3-tools
        echo "NEXUS_BROWSER_TOOLS=$tools" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
        echo "NEXUS_BROWSER_REPORT_DIR=$RUNNER_TEMP/nexus-auth-report" >> "$GITHUB_ENV"
    - name: Verify real account security on a fresh database
      id: acceptance
      run: bash scripts/check-auth-browser.sh
    - name: Preserve credential-free textual evidence
      if: always()
      shell: bash
      env:
        ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
      run: |
        report="$RUNNER_TEMP/nexus-auth-report"
        if [ "$NEXUS_ACCOUNT_SUITE" = password ]; then
          json_files='password-sessions.json'
          summary='password-summary.md'
        else
          json_files='results.json private-profile.json'
          summary='summary.md'
        fi
        if [ "$ACCEPTANCE_OUTCOME" = success ]; then
          test -s "$report/$summary"
          for file in $json_files; do test -s "$report/$file"; done
        fi
        if [ -f "$report/$summary" ]; then
          tee -a "$GITHUB_STEP_SUMMARY" < "$report/$summary"
        fi
        for file in $json_files; do
          if [ -f "$report/$file" ]; then
            { echo; echo '```json'; cat "$report/$file"; echo; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        done
    - name: Keep optional anonymous-page screenshots
      id: evidence
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: account-browser-${{ matrix.suite }}-${{ github.sha }}
        path: ${{ runner.temp }}/nexus-auth-report
        if-no-files-found: warn
        retention-days: 3
    - name: Report missing image evidence
      if: always() && steps.evidence.outcome == 'failure'
      shell: bash
      run: |
        echo '::warning::Optional screenshot upload failed; mandatory assertions and textual evidence retain their result.'
        echo 'WARNING: screenshot upload failed; no image-based visual approval is implied.' >> "$GITHUB_STEP_SUMMARY"
'on':
  workflow_call: null
