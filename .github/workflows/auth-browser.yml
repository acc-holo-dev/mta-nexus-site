name: Account browser

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: account-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-browser:
    name: Account access and logout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.0.0
      - name: Install browser-only tools outside the app
        shell: bash
        run: |
          tools="$RUNNER_TEMP/nexus-auth-tools"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/nexus-auth-browsers"
          npm install --prefix "$tools" --no-audit --no-fund --save-exact @playwright/test@1.62.1 agent-browser@0.33.2
          node "$tools/node_modules/@playwright/test/cli.js" install --with-deps chromium
          sudo apt-get install -y libnss3-tools
          echo "NEXUS_BROWSER_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          echo "NEXUS_BROWSER_REPORT_DIR=$RUNNER_TEMP/nexus-auth-report" >> "$GITHUB_ENV"
      - name: Verify real registration, isolation and revoked-session replay
        id: acceptance
        run: bash scripts/check-auth-browser.sh
      - name: Preserve credential-free textual evidence
        if: always()
        shell: bash
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          report="$RUNNER_TEMP/nexus-auth-report"
          if [ "$ACCEPTANCE_OUTCOME" = success ]; then
            test -s "$report/results.json"
            test -s "$report/summary.md"
          fi
          if [ -f "$report/summary.md" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$report/summary.md"
          fi
          if [ -f "$report/results.json" ]; then cat "$report/results.json"; fi
      - name: Keep optional anonymous-page screenshots
        id: evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: account-browser-${{ github.sha }}
          path: ${{ runner.temp }}/nexus-auth-report
          if-no-files-found: warn
          retention-days: 3
      - name: Report missing image evidence
        if: always() && steps.evidence.outcome == 'failure'
        shell: bash
        run: |
          echo '::warning::Optional screenshot upload failed; mandatory auth assertions and textual evidence retain their result.'
          echo 'WARNING: screenshot upload failed; no image-based visual approval is implied.' >> "$GITHUB_STEP_SUMMARY"
