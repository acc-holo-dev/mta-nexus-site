name: Resource browser
permissions:
  contents: read
jobs:
  resource-browser:
    name: Author publishing, claim and download
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - name: Restore shared production image by exact commit
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/production.tar
        key: nexus-production-image-${{ runner.os }}-${{ github.sha }}
        fail-on-cache-miss: true
    - name: Load the exact commit image
      run: |-
        docker load --input "$RUNNER_TEMP/production.tar"
        bash scripts/validate-ci-image.sh
    - name: Install pinned browser-only tools outside the app
      shell: bash
      run: |
        tools="$RUNNER_TEMP/nexus-resource-tools"
        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/nexus-resource-browsers"
        npm install --prefix "$tools" --no-audit --no-fund --save-exact @playwright/test@1.62.1
        node "$tools/node_modules/@playwright/test/cli.js" install --with-deps chromium
        sudo apt-get install -y libnss3-tools
        echo "NEXUS_BROWSER_TOOLS=$tools" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
        echo "NEXUS_BROWSER_REPORT_DIR=$RUNNER_TEMP/nexus-resource-report" >> "$GITHUB_ENV"
    - name: Verify author workspace and free resource journey
      id: acceptance
      run: bash scripts/check-resource-browser.sh
    - name: Publish textual evidence
      if: always()
      shell: bash
      env:
        ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
      run: |
        report="$RUNNER_TEMP/nexus-resource-report"
        if [ "$ACCEPTANCE_OUTCOME" = success ]; then
          test -s "$report/resource-results.json"
          test -s "$report/resource-summary.md"
          test -s "$report/playwright-report.json"
          test -s "$report/author-results.json"
          test -s "$report/author-summary.md"
          test -s "$report/shell-results.json"
          test -s "$report/shell-summary.md"
          test -s "$report/portfolio-results.json"
          test -s "$report/portfolio-summary.md"
          test -s "$report/download-browser-memory.json"
          test -s "$report/download-hash-results.json"
          test -s "$report/download-network-results.json"
          test -s "$report/download-network-summary.md"
        fi
        for result in download-browser-memory download-hash-results; do
          if [ -f "$report/$result.json" ]; then
            { echo; echo '```json'; cat "$report/$result.json"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
        done
        if [ -f "$report/shell-summary.md" ]; then
          tee -a "$GITHUB_STEP_SUMMARY" < "$report/shell-summary.md"
        fi
        if [ -f "$report/portfolio-summary.md" ]; then
          tee -a "$GITHUB_STEP_SUMMARY" < "$report/portfolio-summary.md"
        fi
        if [ -f "$report/download-network-summary.md" ]; then
          tee -a "$GITHUB_STEP_SUMMARY" < "$report/download-network-summary.md"
        fi
        if [ -f "$report/author-summary.md" ]; then
          tee -a "$GITHUB_STEP_SUMMARY" < "$report/author-summary.md"
        fi
        if [ -f "$report/resource-summary.md" ]; then
          tee -a "$GITHUB_STEP_SUMMARY" < "$report/resource-summary.md"
        fi
        if [ -f "$report/resource-results.json" ]; then
          { echo; echo '```json'; cat "$report/resource-results.json"; echo; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
        fi
    - name: Keep optional browser evidence
      id: evidence
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: resource-browser-${{ github.sha }}
        path: ${{ runner.temp }}/nexus-resource-report
        if-no-files-found: warn
        retention-days: 3
    - name: Report unavailable optional artifacts
      if: always() && steps.evidence.outcome == 'failure'
      shell: bash
      run: |
        echo '::warning::Optional resource browser artifact upload failed; mandatory assertions and textual evidence retain their result.'
    env:
      NEXUS_CI_PREBUILT_IMAGE: nexus-ci:${{ github.sha }}
'on':
  workflow_call: null
