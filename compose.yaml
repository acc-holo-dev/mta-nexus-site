services:
  postgres:
    image: postgres:18-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secret
      POSTGRES_DB: mta_nexus
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 uses a version-specific PGDATA below this parent.
      # Existing databases require inventory and backup before changing layout.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
