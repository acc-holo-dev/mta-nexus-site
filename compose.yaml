# Local development only. Production uses compose.production.yaml explicitly.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secret
      POSTGRES_DB: mta_nexus
    volumes:
      # Existing data layouts still require inventory before an upgrade.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "nexus", "-d", "mta_nexus"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  clamav:
    image: clamav/clamav:1.5
    restart: unless-stopped
    environment:
      # ClamAV otherwise treats archives that exceed scan limits as clean.
      CLAMD_CONF_AlertExceedsMax: "yes"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 48
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    # Leave a failed migration visible instead of restarting it indefinitely.
    restart: "no"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_APP_URL: http://localhost:${NEXUS_DEV_PORT:-3000}
      DATABASE_URL: postgres://nexus:nexus_secret@postgres:5432/mta_nexus
      AUTH_SECRET: development-only-secret-change-before-production
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /data/uploads
      EMAIL_PROVIDER: disabled
      BUILD_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
    ports:
      - "127.0.0.1:${NEXUS_DEV_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
      # Keep dependency installation inside the image, but hot-reload application
      # and workspace source files from the host.
      - ./apps/web/src:/app/apps/web/src:ro
      - ./packages/config/src:/app/packages/config/src:ro
      - ./packages/db/src:/app/packages/db/src:ro
      - ./packages/db/migrations:/app/packages/db/migrations:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
      - ./packages/security/src:/app/packages/security/src:ro
      - ./packages/storage/src:/app/packages/storage/src:ro
      - ./packages/ui/src:/app/packages/ui/src:ro
      - ./packages/validation/src:/app/packages/validation/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/check-local-readiness.mjs"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 60s

  push-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    restart: "no"
    stop_grace_period: 30s
    working_dir: /app/packages/db
    command: ["node", "--import", "tsx", "scripts/run-web-push-dispatcher.ts", "--ready"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nexus:nexus_secret@postgres:5432/mta_nexus
      AUTH_SECRET: development-only-secret-change-before-production
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /data/uploads
      EMAIL_PROVIDER: disabled
      BUILD_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
    volumes:
      - ./packages/config/src:/app/packages/config/src:ro
      - ./packages/db/src:/app/packages/db/src:ro
      - ./packages/db/scripts:/app/packages/db/scripts:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
      - ./packages/security/src:/app/packages/security/src:ro
      - ./packages/validation/src:/app/packages/validation/src:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/scripts/check-web-push-worker-health.mjs"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  license-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /app/packages/db
    command: ["node", "--import", "tsx", "scripts/run-license-maintenance.ts", "--loop"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nexus:nexus_secret@postgres:5432/mta_nexus
      NEXUS_LICENSE_MAINTENANCE: "true"
      NEXUS_LICENSE_MAINTENANCE_BATCH_SIZE: ${NEXUS_LICENSE_MAINTENANCE_BATCH_SIZE:-20}
      NEXUS_LICENSE_MAINTENANCE_INTERVAL_MS: ${NEXUS_LICENSE_MAINTENANCE_INTERVAL_MS:-60000}
    volumes:
      - ./packages/db/src:/app/packages/db/src:ro
      - ./packages/db/scripts:/app/packages/db/scripts:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
      - ./packages/config/src:/app/packages/config/src:ro
      - ./packages/validation/src:/app/packages/validation/src:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/scripts/check-license-worker-health.mjs"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  resource-release-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /app/packages/db
    command: ["node", "--import", "tsx", "scripts/run-resource-release-worker.ts", "--loop"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nexus:nexus_secret@postgres:5432/mta_nexus
      NEXUS_RESOURCE_RELEASE_WORKER: "true"
      NEXUS_RESOURCE_RELEASE_WORKER_BATCH_SIZE: ${NEXUS_RESOURCE_RELEASE_WORKER_BATCH_SIZE:-20}
      NEXUS_RESOURCE_RELEASE_WORKER_INTERVAL_MS: ${NEXUS_RESOURCE_RELEASE_WORKER_INTERVAL_MS:-60000}
    volumes:
      - ./packages/db/src:/app/packages/db/src:ro
      - ./packages/db/scripts:/app/packages/db/scripts:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
      - ./packages/config/src:/app/packages/config/src:ro
      - ./packages/validation/src:/app/packages/validation/src:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/scripts/check-resource-release-worker-health.mjs"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

volumes:
  pgdata:
  uploads:
  clamav_data:
