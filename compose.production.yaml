services:
  clamav:
    image: clamav/clamav:1.5
    restart: unless-stopped
    environment:
      # Never report an incompletely scanned archive as clean.
      CLAMD_CONF_AlertExceedsMax: "yes"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mta_nexus}
    volumes:
      # PostgreSQL 18 uses a version-specific PGDATA below this parent.
      # Existing databases require inventory and backup before changing layout.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: https://${DOMAIN:?set DOMAIN in .env}
      MTA_MASTER_MIRROR_URLS: ${MTA_MASTER_MIRROR_URLS:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mta_nexus}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:?set TRUSTED_PROXY_SECRET in .env}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /data/uploads
      EMAIL_PROVIDER: disabled
      BUILD_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SMTP_FROM: no-reply@${DOMAIN}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    # Use the image's single production entrypoint: migrations, then Next.js.
    healthcheck:
      # Gate public proxy traffic on HTTP/database readiness and a real
      # read/write probe against the mounted private upload storage.
      test: ["CMD", "node", "scripts/check-local-readiness.mjs"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s

  push-worker:
    build:
      context: .
      dockerfile: Dockerfile
    user: node
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_signal: SIGTERM
    stop_grace_period: 75s
    working_dir: /app/packages/db
    command: ["node", "--import", "tsx", "scripts/run-web-push-dispatcher.ts", "--ready"]
    environment:
      NODE_ENV: production
      HOME: /tmp
      TMPDIR: /tmp
      NEXT_PUBLIC_APP_URL: https://${DOMAIN:?set DOMAIN in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mta_nexus}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /data/uploads
      EMAIL_PROVIDER: disabled
      BUILD_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SMTP_FROM: no-reply@${DOMAIN}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_PUSH_QUEUE_ALERT_PENDING_PERCENT: ${WEB_PUSH_QUEUE_ALERT_PENDING_PERCENT:-80}
      WEB_PUSH_QUEUE_ALERT_DUE_JOBS: ${WEB_PUSH_QUEUE_ALERT_DUE_JOBS:-100}
      WEB_PUSH_QUEUE_ALERT_OLDEST_AGE_SECONDS: ${WEB_PUSH_QUEUE_ALERT_OLDEST_AGE_SECONDS:-900}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/scripts/check-web-push-worker-health.mjs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:?set TRUSTED_PROXY_SECRET in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  license-worker:
    build:
      context: .
      dockerfile: Dockerfile
    user: node
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /app/packages/db
    command: ["node", "--import", "tsx", "scripts/run-license-maintenance.ts", "--loop"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mta_nexus}
      NEXUS_LICENSE_MAINTENANCE: "true"
      NEXUS_LICENSE_MAINTENANCE_BATCH_SIZE: ${NEXUS_LICENSE_MAINTENANCE_BATCH_SIZE:-20}
      NEXUS_LICENSE_MAINTENANCE_INTERVAL_MS: ${NEXUS_LICENSE_MAINTENANCE_INTERVAL_MS:-60000}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/scripts/check-license-worker-health.mjs"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  resource-release-worker:
    build:
      context: .
      dockerfile: Dockerfile
    user: node
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /app/packages/db
    command: ["node", "--import", "tsx", "scripts/run-resource-release-worker.ts", "--loop"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mta_nexus}
      NEXUS_RESOURCE_RELEASE_WORKER: "true"
      NEXUS_RESOURCE_RELEASE_WORKER_BATCH_SIZE: ${NEXUS_RESOURCE_RELEASE_WORKER_BATCH_SIZE:-20}
      NEXUS_RESOURCE_RELEASE_WORKER_INTERVAL_MS: ${NEXUS_RESOURCE_RELEASE_WORKER_INTERVAL_MS:-60000}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/scripts/check-resource-release-worker-health.mjs"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  clamav_data:
