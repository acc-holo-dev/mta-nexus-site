services:
  clamav:
    image: clamav/clamav:1.5
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mta_nexus}
    volumes:
      # PostgreSQL 18 uses a version-specific PGDATA below this parent.
      # Existing databases require inventory and backup before changing layout.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: https://${DOMAIN:?set DOMAIN in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mta_nexus}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:?set TRUSTED_PROXY_SECRET in .env}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /data/uploads
      EMAIL_PROVIDER: disabled
      BUILD_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SMTP_FROM: no-reply@${DOMAIN}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    # Use the image's single production entrypoint: migrations, then Next.js.
    healthcheck:
      # Gate public proxy traffic on HTTP/database readiness and a real
      # read/write probe against the mounted private upload storage.
      test: ["CMD", "node", "scripts/check-local-readiness.mjs"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:?set TRUSTED_PROXY_SECRET in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  clamav_data:
