# Optional file-backed SMTP password for the recovery mail worker.
# Include after compose.mail-worker.yaml when SMTP AUTH is enabled.
secrets:
  nexus_account_mail_smtp_password:
    file: ${NEXUS_ACCOUNT_MAIL_SMTP_PASSWORD_HOST_FILE:?set NEXUS_ACCOUNT_MAIL_SMTP_PASSWORD_HOST_FILE}

services:
  mail-worker:
    environment:
      ACCOUNT_MAIL_SMTP_PASSWORD: ""
      ACCOUNT_MAIL_SMTP_PASSWORD_FILE: /run/secrets/nexus_account_mail_smtp_password
    secrets:
      - nexus_account_mail_smtp_password
