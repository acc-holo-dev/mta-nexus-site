# Optional previous decrypt-only mail key for a bounded rotation drain window.
# Include after compose.mail-worker.yaml and set ACCOUNT_MAIL_PREVIOUS_KEY_ID.
secrets:
  nexus_account_mail_previous_key:
    file: ${NEXUS_ACCOUNT_MAIL_PREVIOUS_KEY_HOST_FILE:?set NEXUS_ACCOUNT_MAIL_PREVIOUS_KEY_HOST_FILE}

services:
  mail-worker:
    environment:
      ACCOUNT_MAIL_PREVIOUS_KEY: ""
      ACCOUNT_MAIL_PREVIOUS_KEY_FILE: /run/secrets/nexus_account_mail_previous_key
    secrets:
      - nexus_account_mail_previous_key
