# Optional file-backed SMTP password for the recovery mail worker.
# Include after compose.mail-worker.yaml when SMTP AUTH is enabled.
services:
  mail-worker:
    environment:
      ACCOUNT_MAIL_SMTP_PASSWORD: ""
      ACCOUNT_MAIL_SMTP_PASSWORD_FILE: /run/secrets/nexus-recovery/smtp-password
    volumes:
      - type: bind
        source: ${NEXUS_ACCOUNT_MAIL_SMTP_PASSWORD_HOST_FILE:?set NEXUS_ACCOUNT_MAIL_SMTP_PASSWORD_HOST_FILE}
        target: /run/secrets/nexus-recovery/smtp-password
        read_only: true
