# Optional previous decrypt-only mail key for a bounded rotation drain window.
# Include after compose.mail-worker.yaml and set ACCOUNT_MAIL_PREVIOUS_KEY_ID.
services:
  mail-worker:
    environment:
      ACCOUNT_MAIL_PREVIOUS_KEY: ""
      ACCOUNT_MAIL_PREVIOUS_KEY_FILE: /run/secrets/nexus-recovery/account-mail-previous-key
    volumes:
      - type: bind
        source: ${NEXUS_ACCOUNT_MAIL_PREVIOUS_KEY_HOST_FILE:?set NEXUS_ACCOUNT_MAIL_PREVIOUS_KEY_HOST_FILE}
        target: /run/secrets/nexus-recovery/account-mail-previous-key
        read_only: true
